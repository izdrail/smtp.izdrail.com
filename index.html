<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMTP Verifier | Premium Edition</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Header:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        glass: {
                            DEFAULT: 'rgba(255, 255, 255, 0.05)',
                            hover: 'rgba(255, 255, 255, 0.1)',
                            border: 'rgba(255, 255, 255, 0.1)',
                        }
                    },
                    animation: {
                        'gradient': 'gradient 15s ease infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'spin-slow': 'spin 3s linear infinite',
                        'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        gradient: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        'pulse-glow': {
                            '0%, 100%': { opacity: '1', boxShadow: '0 0 10px rgba(59, 130, 246, 0.5)' },
                            '50%': { opacity: '0.7', boxShadow: '0 0 20px rgba(59, 130, 246, 0.8)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #0f172a);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(0, 0, 0, 0.3);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
        }

        .glass-btn {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.8), rgba(79, 70, 229, 0.8));
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .glass-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }

        .glass-btn:hover::before {
            left: 100%;
        }

        .result-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .result-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Switch Toggle */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #68D391;
        }

        .toggle-checkbox:checked+.toggle-label {
            background-color: #68D391;
        }
    </style>
</head>

<body class="min-h-screen text-slate-200 font-sans selection:bg-indigo-500 selection:text-white flex flex-col">

    <!-- Navbar -->
    <nav class="glass-panel sticky top-0 z-50 border-b border-glass-border">
        <div class="max-w-[1920px] mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div
                    class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <span
                    class="text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">SMTP
                    Verifier</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-black/20 border border-white/5">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    <span class="text-xs font-medium text-slate-400">System Online</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Grid -->
    <main
        class="flex-1 max-w-[1920px] mx-auto w-full p-6 lg:p-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-12 gap-6 items-start h-[calc(100vh-64px)] overflow-hidden">

        <!-- Left Panel: Controls (3 cols) -->
        <div class="lg:col-span-3 space-y-4 h-full flex flex-col overflow-y-auto pr-1">
            <!-- Glass Card -->
            <div class="glass-panel rounded-2xl overflow-hidden shadow-2xl animate-float"
                style="animation-duration: 8s;">
                <!-- Tab Headers -->
                <div class="flex border-b border-white/5 overflow-x-auto">
                    <button onclick="switchTab('single')"
                        class="tab-btn active flex-1 px-4 py-4 text-sm font-medium transition-all duration-300 border-b-2 border-indigo-500 text-white bg-white/5"
                        data-tab="single">Single</button>
                    <button onclick="switchTab('bulk')"
                        class="tab-btn flex-1 px-4 py-4 text-sm font-medium transition-all duration-300 border-b-2 border-transparent text-slate-400 hover:text-white hover:bg-white/5"
                        data-tab="bulk">Bulk</button>
                    <button onclick="switchTab('async')"
                        class="tab-btn flex-1 px-4 py-4 text-sm font-medium transition-all duration-300 border-b-2 border-transparent text-slate-400 hover:text-white hover:bg-white/5"
                        data-tab="async">Async</button>
                </div>

                <!-- Tab Contents -->
                <div class="p-6">
                    <!-- Single Tab -->
                    <div id="single" class="tab-content space-y-5">
                        <div class="space-y-4">
                            <div class="group">
                                <label
                                    class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2 group-focus-within:text-indigo-400 transition-colors">Email
                                    Address</label>
                                <input type="email" id="singleEmail" placeholder="name@company.com"
                                    class="glass-input w-full px-4 py-3 rounded-xl text-white placeholder-slate-600 outline-none">
                            </div>
                            <div class="group">
                                <label
                                    class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2 group-focus-within:text-indigo-400 transition-colors">Password</label>
                                <input type="password" id="singlePassword" placeholder="••••••••••••"
                                    class="glass-input w-full px-4 py-3 rounded-xl text-white placeholder-slate-600 outline-none">
                            </div>
                        </div>
                        <button onclick="verifySingle()" id="singleBtn"
                            class="glass-btn w-full py-4 rounded-xl text-white font-semibold shadow-lg shadow-indigo-500/20 active:scale-95 transition-all flex items-center justify-center gap-2 group">
                            <span>Verify Identity</span>
                            <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- Bulk Tab -->
                    <div id="bulk" class="tab-content space-y-5 hidden">
                        <div
                            class="border-2 border-dashed border-white/10 rounded-xl p-8 text-center hover:border-indigo-500/50 transition-colors group">
                            <input type="file" id="bulkFile" accept=".txt,.csv" class="hidden"
                                onchange="updateFileName(this)">
                            <label for="bulkFile" class="cursor-pointer block space-y-2">
                                <div
                                    class="w-12 h-12 rounded-full bg-white/5 mx-auto flex items-center justify-center group-hover:scale-110 transition-transform">
                                    <svg class="w-6 h-6 text-slate-400 group-hover:text-indigo-400" fill="none"
                                        stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12">
                                        </path>
                                    </svg>
                                </div>
                                <p class="text-sm text-slate-300 font-medium" id="fileName">Click to upload file</p>
                                <p class="text-xs text-slate-500">Supported: .txt, .csv</p>
                            </label>
                        </div>
                        <button onclick="verifyBulk()" id="bulkBtn"
                            class="glass-btn w-full py-4 rounded-xl text-white font-semibold shadow-lg shadow-indigo-500/20 active:scale-95 transition-all flex items-center justify-center gap-2">
                            <span>Start Bulk Processing</span>
                        </button>
                    </div>

                    <!-- Async Tab -->
                    <div id="async" class="tab-content space-y-5 hidden">
                        <div class="space-y-4">
                            <div class="group">
                                <label
                                    class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2 group-focus-within:text-purple-400 transition-colors">Email
                                    Address</label>
                                <input type="email" id="asyncEmail" placeholder="name@company.com"
                                    class="glass-input w-full px-4 py-3 rounded-xl text-white placeholder-slate-600 outline-none">
                            </div>
                            <div class="group">
                                <label
                                    class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2 group-focus-within:text-purple-400 transition-colors">Password</label>
                                <input type="password" id="asyncPassword" placeholder="••••••••••••"
                                    class="glass-input w-full px-4 py-3 rounded-xl text-white placeholder-slate-600 outline-none">
                            </div>
                        </div>
                        <button onclick="verifyAsync()" id="asyncBtn"
                            class="glass-btn w-full py-4 rounded-xl text-white font-semibold shadow-lg shadow-indigo-500/20 active:scale-95 transition-all flex items-center justify-center gap-2">
                            <span>Submit Background Job</span>
                            <svg class="w-4 h-4 animate-spin-slow" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                                </path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Quick Stats -->
            <div class="grid grid-cols-2 gap-4">
                <div class="glass-panel p-4 rounded-xl">
                    <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Queue</p>
                    <p class="text-2xl font-bold text-white flex items-center gap-2">
                        <span id="activeJobsCount">0</span>
                        <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
                    </p>
                </div>
                <div class="glass-panel p-4 rounded-xl">
                    <p class="text-xs text-slate-400 uppercase tracking-wider mb-1">Completed</p>
                    <p class="text-2xl font-bold text-white flex items-center gap-2">
                        <span id="completedJobsCount">--</span>
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    </p>
                </div>
            </div>

            <!-- Active Workers -->
            <div class="glass-panel p-4 rounded-xl">
                <div class="flex justify-between items-center mb-3">
                    <p class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Worker Status</p>
                    <button onclick="stopAllWorkers()"
                        class="text-[10px] bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 px-2.5 py-1 rounded transition-colors border border-rose-500/20 active:scale-95">Stop
                        All</button>
                </div>
                <div id="workerGrid" class="grid grid-cols-2 gap-2">
                    <!-- Injected by JS -->
                    <div class="bg-white/5 rounded p-2 border border-white/5 animate-pulse h-16"></div>
                    <div class="bg-white/5 rounded p-2 border border-white/5 animate-pulse h-16"></div>
                    <div class="bg-white/5 rounded p-2 border border-white/5 animate-pulse h-16"></div>
                    <div class="bg-white/5 rounded p-2 border border-white/5 animate-pulse h-16"></div>
                </div>
            </div>
        </div>

        <!-- Middle Panel: Results (5 cols) -->
        <div class="lg:col-span-5 flex flex-col gap-6 h-full overflow-hidden">

            <!-- Active Jobs Monitor (Async) -->
            <div id="jobsContainer" class="glass-panel rounded-2xl p-6 hidden shrink-0">
                <div class="flex items-center justify-between mb-4 pb-4 border-b border-white/5">
                    <h3 class="text-lg font-semibold text-white flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                        Live Operations
                    </h3>
                </div>
                <div id="jobsList" class="grid grid-cols-1 gap-4 max-h-[220px] overflow-y-auto pr-2"></div>
            </div>

            <!-- Main Results Area -->
            <div class="glass-panel rounded-2xl flex-1 p-6 flex flex-col relative overflow-hidden h-full">
                <!-- Background Decoration -->
                <div class="absolute top-0 right-0 p-6 pointer-events-none">
                    <svg class="w-64 h-64 text-indigo-500/5 rotate-12" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z">
                        </path>
                    </svg>
                </div>

                <div class="flex items-center justify-between mb-6 z-10">
                    <h2 class="text-xl font-bold text-white">Current Results</h2>
                    <button onclick="document.getElementById('resultsGrid').innerHTML = ''"
                        class="text-xs text-slate-500 hover:text-white transition-colors">Clear</button>
                </div>

                <div id="resultsContainer" class="flex-1 flex flex-col z-10 overflow-hidden">
                    <div id="emptyState"
                        class="flex-1 flex flex-col items-center justify-center text-slate-500 space-y-4">
                        <div class="w-20 h-20 rounded-full bg-white/5 flex items-center justify-center animate-pulse">
                            <svg class="w-10 h-10 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01">
                                </path>
                            </svg>
                        </div>
                        <p>Waiting for verification requests...</p>
                    </div>
                    <div id="resultsGrid" class="grid grid-cols-1 gap-4 overflow-y-auto custom-scrollbar pr-2 pb-4">
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel: History (4 cols) -->
        <div class="lg:col-span-4 h-full flex flex-col overflow-hidden glass-panel rounded-2xl animate-float"
            style="animation-duration: 9s;">
            <div class="p-6 border-b border-white/5 flex flex-col gap-4 bg-black/10">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        Scan History
                    </h2>
                    <div class="flex items-center gap-2">
                        <div class="relative group">
                            <button
                                class="p-2 rounded-lg bg-indigo-500/20 hover:bg-indigo-500/40 text-indigo-300 transition-colors"
                                title="Export Options">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                </svg>
                            </button>
                            <div
                                class="absolute right-0 mt-2 w-48 bg-slate-900 border border-white/10 rounded-xl shadow-xl overflow-hidden hidden group-hover:block z-50">
                                <button onclick="exportHistory('current', 'csv')"
                                    class="w-full text-left px-4 py-3 text-sm text-slate-300 hover:bg-white/5 hover:text-white transition-colors">Export
                                    Current (CSV)</button>
                                <button onclick="exportHistory('all', 'csv')"
                                    class="w-full text-left px-4 py-3 text-sm text-slate-300 hover:bg-white/5 hover:text-white transition-colors border-t border-white/5">Export
                                    All (CSV)</button>
                                <button onclick="exportHistory('all', 'txt')"
                                    class="w-full text-left px-4 py-3 text-sm text-slate-300 hover:bg-white/5 hover:text-white transition-colors border-t border-white/5">Export
                                    All (TXT: Email:Pass)</button>
                                <button onclick="window.open('/api/export?status=success&format=csv')"
                                    class="w-full text-left px-4 py-3 text-sm text-slate-300 hover:bg-white/5 hover:text-white transition-colors border-t border-white/5">Export
                                    Valid (CSV)</button>
                                <button onclick="window.open('/api/export?status=success&format=txt')"
                                    class="w-full text-left px-4 py-3 text-sm text-slate-300 hover:bg-white/5 hover:text-white transition-colors border-t border-white/5">Export
                                    Valid (TXT: Email:Pass)</button>
                            </div>
                        </div>
                        <button onclick="toggleAutoRefresh()" id="refreshBtn"
                            class="p-2 rounded-lg bg-white/5 hover:bg-white/10 text-slate-400 transition-colors"
                            title="Auto Refresh">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Tabs & Search -->
                <div class="flex flex-col gap-3">
                    <div class="flex bg-black/20 p-1 rounded-lg">
                        <button onclick="setFilter('')"
                            class="flex-1 py-1.5 text-xs font-medium rounded-md transition-all text-white bg-indigo-500 shadow-lg"
                            id="tab-all">All</button>
                        <button onclick="setFilter('success')"
                            class="flex-1 py-1.5 text-xs font-medium rounded-md transition-all text-slate-400 hover:text-white"
                            id="tab-success">Valid</button>
                        <button onclick="setFilter('failed')"
                            class="flex-1 py-1.5 text-xs font-medium rounded-md transition-all text-slate-400 hover:text-white"
                            id="tab-failed">Invalid</button>
                        <button onclick="setFilter('pending')"
                            class="flex-1 py-1.5 text-xs font-medium rounded-md transition-all text-slate-400 hover:text-white"
                            id="tab-pending">Queue</button>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="historyFilter" placeholder="Search email..."
                            class="glass-input flex-1 px-3 py-2 rounded-lg text-sm text-white focus:outline-none"
                            onkeyup="if(event.key === 'Enter') loadHistory()">
                        <button onclick="loadHistory()"
                            class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-medium transition-colors">Search</button>
                    </div>
                </div>
            </div>

            <div id="historyList" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                <div class="text-center py-10 text-slate-500 text-sm">Waiting to fetch data...</div>
            </div>

            <!-- Footer: Pagination & Clear -->
            <div class="p-4 border-t border-white/5 bg-black/10 space-y-3">
                <div class="flex items-center justify-between text-xs text-slate-400">
                    <span id="pageInfo">Page 1</span>
                    <div class="flex gap-2">
                        <button onclick="changePage(-1)" id="prevBtn" disabled
                            class="px-2 py-1 rounded bg-white/5 disabled:opacity-50 hover:bg-white/10 transition-colors">Prev</button>
                        <button onclick="changePage(1)" id="nextBtn" disabled
                            class="px-2 py-1 rounded bg-white/5 disabled:opacity-50 hover:bg-white/10 transition-colors">Next</button>
                    </div>
                </div>
                <button onclick="clearHistory()"
                    class="w-full py-2 text-xs font-medium text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 rounded-lg transition-colors">Clear
                    All History</button>
            </div>
        </div>
    </main>

    <!-- Log Modal -->
    <div id="logModal"
        class="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm hidden transition-opacity duration-300">
        <div class="glass-panel w-full max-w-3xl rounded-2xl overflow-hidden shadow-2xl transform transition-all scale-95 opacity-0 m-4"
            id="logModalContent">
            <div
                class="p-6 border-b border-white/5 flex justify-between items-center bg-gradient-to-r from-indigo-500/10 to-purple-500/10">
                <h3 class="text-lg font-bold text-white flex items-center gap-3">
                    <span class="relative flex h-3 w-3">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-indigo-500"></span>
                    </span>
                    <span id="logModalTitle">Verifying...</span>
                </h3>
                <button onclick="closeLogModal()"
                    class="text-slate-400 hover:text-white transition-colors p-2 hover:bg-white/10 rounded-lg">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="relative bg-slate-900/90 font-mono text-xs text-slate-300 h-[28rem] overflow-y-auto custom-scrollbar p-6 space-y-1"
                id="modalLogs">
                <div class="text-slate-500 italic text-center mt-20">Initializing connection...</div>
            </div>

            <div class="p-4 border-t border-white/5 bg-black/20 flex justify-between items-center">
                <div class="flex items-center gap-2 text-xs text-slate-400">
                    <span id="logStatus"
                        class="uppercase tracking-wider font-semibold text-indigo-400">CONNECTING</span>
                    <span class="w-1 h-1 rounded-full bg-slate-600"></span>
                    <span id="logTime">00:00:00</span>
                </div>
                <button onclick="closeLogModal()"
                    class="glass-btn px-6 py-2.5 rounded-xl text-white text-sm font-medium hover:scale-105 active:scale-95 transition-all shadow-lg shadow-indigo-500/20">Close
                    Monitor</button>
            </div>
        </div>
    </div>

    <!-- Send Test Modal -->
    <div id="testModal"
        class="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm hidden transition-opacity duration-300">
        <div class="glass-panel w-full max-w-lg rounded-2xl overflow-hidden shadow-2xl transform transition-all scale-95 opacity-0 m-4"
            id="testModalContent">
            <div
                class="p-6 border-b border-white/5 flex justify-between items-center bg-gradient-to-r from-indigo-500/10 to-purple-500/10">
                <h3 class="text-lg font-bold text-white flex items-center gap-3">
                    <svg class="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    Send Test Email
                </h3>
                <button onclick="closeTestModal()"
                    class="text-slate-400 hover:text-white transition-colors p-2 hover:bg-white/10 rounded-lg">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div class="p-6 space-y-4">
                <div class="bg-black/20 p-3 rounded-lg border border-white/5">
                    <p class="text-[10px] text-slate-500 uppercase tracking-widest font-bold mb-1">From Account</p>
                    <p id="testFrom" class="text-sm text-indigo-300 font-mono"></p>
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2">Recipient
                        Email</label>
                    <input type="email" id="testTo" placeholder="recipient@example.com"
                        class="glass-input w-full px-4 py-3 rounded-xl text-white placeholder-slate-600 outline-none">
                </div>
                <div>
                    <label
                        class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2">Subject</label>
                    <input type="text" id="testSubject" value="SMTP Verification Test"
                        class="glass-input w-full px-4 py-3 rounded-xl text-white placeholder-slate-600 outline-none">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2">Message
                        Body</label>
                    <textarea id="testBody" rows="4"
                        class="glass-input w-full px-4 py-3 rounded-xl text-white placeholder-slate-600 outline-none resize-none">This is a test email sent from the SMTP Verifier tool to confirm that these credentials work correctly for sending.</textarea>
                </div>
            </div>

            <div class="p-4 border-t border-white/5 bg-black/20 flex justify-end items-center gap-3">
                <button onclick="closeTestModal()"
                    class="px-4 py-2 text-sm text-slate-400 hover:text-white transition-colors">Cancel</button>
                <button onclick="performTestSend()" id="sendTestBtn"
                    class="glass-btn px-6 py-2.5 rounded-xl text-white text-sm font-medium hover:scale-105 active:scale-95 transition-all shadow-lg shadow-indigo-500/20">
                    Send Email
                </button>
            </div>
        </div>
    </div>

    <!-- JS Logic -->
    <script>
        const jobs = {};
        const state = {
            activeJobs: 0,
            completedJobs: 0,
            autoRefresh: false,
            refreshInterval: null,
            page: 1,
            limit: 50,
            total: 0,
            filterStatus: ''
        };

        // UI Helpers
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('border-indigo-500', 'text-white', 'bg-white/5');
                el.classList.add('border-transparent', 'text-slate-400');
            });

            document.getElementById(tab).classList.remove('hidden');
            const activeBtn = document.querySelector('[data-tab="' + tab + '"]');
            activeBtn.classList.remove('border-transparent', 'text-slate-400');
            activeBtn.classList.add('border-indigo-500', 'text-white', 'bg-white/5');
        }

        function updateFileName(input) {
            const fileName = input.files[0]?.name || 'Click to upload file';
            document.getElementById('fileName').textContent = fileName;
        }

        function updateStats() {
            document.getElementById('activeJobsCount').textContent = state.activeJobs;
            document.getElementById('completedJobsCount').textContent = state.completedJobs > 0 ? state.activeJobs + state.completedJobs : state.completedJobs;
        }

        // Templates
        function getResultCard(res) {
            const isSuccess = res.status === 'success';
            const isPending = res.status === 'pending';

            let statusColor = 'bg-rose-500';
            if (isSuccess) statusColor = 'bg-emerald-500';
            if (isPending) statusColor = 'bg-amber-500';

            const statusIcon = isSuccess ? '✓' : (isPending ? '⟳' : '✕');
            const borderColor = isSuccess ? 'border-emerald-500' : (isPending ? 'border-amber-500' : 'border-rose-500');

            // Logs & Headers
            let logs = [];
            try {
                if (typeof res.logs === 'string') logs = JSON.parse(res.logs);
                else if (Array.isArray(res.logs)) logs = res.logs;
                // Fallback to headers if logs missing
                if (!logs.length && res.headers) {
                    if (typeof res.headers === 'string') logs = JSON.parse(res.headers);
                    else if (Array.isArray(res.headers)) logs = res.headers;
                }
            } catch (e) { }

            return `<div class="glass-panel p-5 rounded-xl border-l-4 ${borderColor} result-card animate-float" style="animation: fadeUp 0.5s ease backwards;">
                <div class="flex justify-between items-start mb-3">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-8 h-8 rounded-full ${isSuccess ? 'bg-emerald-500/20 text-emerald-400' : (isPending ? 'bg-amber-500/20 text-amber-400' : 'bg-rose-500/20 text-rose-400')} flex items-center justify-center font-bold text-sm border ${isSuccess ? 'border-emerald-500/30' : (isPending ? 'border-amber-500/30' : 'border-rose-500/30')}">
                            ${statusIcon}
                        </div>
                        <div class="min-w-0 flex-1">
                            <h4 class="font-medium text-white truncate text-sm" title="${res.email}">${res.email}</h4>
                            <p class="text-xs text-slate-400 capitalize">${res.domain || 'Unknown Domain'}</p>
                        </div>
                    </div>
                    <span class="text-xs px-2 py-1 rounded bg-white/5 text-slate-400">${isSuccess ? 'Valid' : (isPending ? 'Pending' : 'Invalid')}</span>
                </div>
                
                ${res.error ? `<div class="bg-rose-500/10 border border-rose-500/20 rounded p-2 mb-3 text-xs text-rose-300 font-mono break-all">${res.error}</div>` : ''}
                
                ${res.capabilities ? `
                <div class="grid grid-cols-2 gap-2 text-xs mb-2">
                    <div class="bg-white/5 rounded p-2">
                        <p class="text-slate-500 mb-1 font-semibold uppercase tracking-wider">Host</p>
                        <p class="text-slate-300 truncate font-mono">${res.capabilities.host}</p>
                    </div>
                     <div class="bg-white/5 rounded p-2">
                        <p class="text-slate-500 mb-1 font-semibold uppercase tracking-wider">TLS</p>
                        <p class="text-slate-300 font-mono">${res.capabilities.starttls ? 'YES' : 'NO'}</p>
                    </div>
                </div>` : ''}
                
                <!-- Credentials Section -->
                <div class="bg-black/20 rounded p-2 mb-2 flex items-center justify-between text-xs">
                    <div class="flex items-center gap-2">
                        <span class="text-slate-500 uppercase tracking-wider text-[10px]">User:</span>
                        <span class="text-slate-300 truncate max-w-[100px]" title="${res.email}">${res.email.split('@')[0]}</span>
                    </div>
                    <div class="flex items-center gap-2 group cursor-pointer relative" onclick="this.classList.toggle('reveal')">
                         <span class="text-slate-500 uppercase tracking-wider text-[10px]">Pass:</span>
                         <span class="text-slate-300 font-mono tracking-widest blur-sm transition-all group-[.reveal]:blur-none group-[.reveal]:tracking-normal select-none">${res.password || '••••••'}</span>
                         <span class="absolute right-0 top-0 bottom-0 bg-transparent w-full text-center text-[10px] text-indigo-400/50 group-hover:text-indigo-400 opacity-0 group-hover:opacity-100 group-[.reveal]:hidden transition-opacity flex items-center justify-end">Click to show</span>
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex gap-2 mb-1">
                   ${isPending ?
                    `<button onclick="event.stopPropagation(); retryScanWithLogs('${res.id}', '${res.email}', '${res.password || ''}')" class="flex-1 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 text-xs py-1.5 rounded transition-colors border border-amber-500/20 flex items-center justify-center gap-1">
                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        Try Now
                      </button>` :
                    `<button onclick="event.stopPropagation(); retryScanWithLogs('', '${res.email}', '${res.password || ''}')" class="flex-1 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 text-xs py-1.5 rounded transition-colors border border-indigo-500/20 flex items-center justify-center gap-1">
                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                        Retry
                      </button>`
                }
                ${isSuccess ?
                    `<button onclick="event.stopPropagation(); openTestModal('${res.email}', '${res.password || ''}')" class="flex-1 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 text-xs py-1.5 rounded transition-colors border border-emerald-500/20 flex items-center justify-center gap-1">
                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>
                        Send Test
                      </button>` : ''
                }
                </div>

                <!-- Technical Details Toggle -->
                <details class="group mt-2">
                    <summary class="text-[10px] text-indigo-400 cursor-pointer hover:text-indigo-300 select-none flex items-center gap-1">
                        <span>Show Technical Details (${logs.length} logs)</span>
                        <svg class="w-3 h-3 transition-transform group-open:rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
                    </summary>
                    <div class="mt-2 text-[10px] bg-black/30 rounded p-2 font-mono text-slate-400 overflow-x-auto max-h-32 custom-scrollbar">
                        <p><span class="text-slate-500">ID:</span> ${res.id}</p>
                        <p><span class="text-slate-500">Auth Method:</span> ${res.auth_method || 'N/A'}</p>
                        ${logs.length ? `<div class="mt-1"><span class="text-slate-500">Logs:</span><ul class="pl-0 mt-1 space-y-0.5 text-slate-400">${logs.map(h => `<li class="truncate border-l-2 border-white/5 pl-2 hover:border-indigo-500 hover:text-white transition-colors">${h}</li>`).join('')}</ul></div>` : ''}
                    </div>
                </details>
    
                <div class="flex justify-between items-center text-[10px] text-slate-500 mt-2 border-t border-white/5 pt-2">
                     <span>${new Date(res.created_at || Date.now()).toLocaleTimeString()}</span>
                     <span>JOB: ${res.id ? res.id.substring(0, 6) : 'SYNC'}</span>
                </div>
            </div>`;
        }

        function getJobCard(job) {
            const isPending = job.status === 'pending';
            return `<div class="bg-white/5 rounded-lg p-3 border border-white/5 flex items-center gap-3 hover:bg-white/10 transition-colors" id="job-${job.id}">
                <div class="w-8 h-8 rounded-full flex items-center justify-center ${isPending ? 'bg-amber-500/20 text-amber-400' : (job.status === 'success' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400')}">
                    ${isPending ? '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>' : (job.status === 'success' ? '✓' : '✕')}
                </div>
                <div class="min-w-0 flex-1">
                    <div class="flex justify-between">
                         <p class="text-sm font-medium text-white truncate w-32" title="${job.email}">${job.email}</p>
                         <span class="text-[10px] uppercase tracking-wider ${isPending ? 'text-amber-400' : 'text-slate-400'}">${job.status}</span>
                    </div>
                    ${job.error ? `<p class="text-xs text-rose-400 truncate w-full">${job.error}</p>` : `<p class="text-xs text-slate-500">Processing...</p>`}
                </div>
            </div>`;
        }

        function displayResults(results) {
            const container = document.getElementById('resultsGrid');
            const emptyState = document.getElementById('emptyState');

            if (results && results.length > 0) {
                emptyState.classList.add('hidden');
                results.forEach(res => {
                    // Prepend new results
                    container.insertAdjacentHTML('afterbegin', getResultCard(res));
                });
                state.completedJobs += results.length;
                updateStats();

                // Refresh history if auto-refresh is on
                if (state.autoRefresh) loadHistory();
            }
        }

        // Logic
        async function verifySingle() {
            const email = document.getElementById('singleEmail').value;
            const password = document.getElementById('singlePassword').value;
            if (!email || !password) return;

            const btn = document.getElementById('singleBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span>Verifying...</span><svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';

            try {
                const res = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                // Add ID manually if missing from sync resp
                if (!data.id) data.id = 'SYNC-' + Math.random().toString(36).substr(2, 5);
                displayResults([data]);

                document.getElementById('singleEmail').value = '';
                document.getElementById('singlePassword').value = '';
                loadHistory(); // Always update history after single action
            } catch (err) {
                displayResults([{
                    status: 'failed',
                    email: email,
                    domain: email.split('@')[1] || 'unknown',
                    error: err.message
                }]);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        async function verifyBulk() {
            const file = document.getElementById('bulkFile').files[0];
            if (!file) return;

            const btn = document.getElementById('bulkBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.textContent = 'Processing...';

            try {
                const formData = new FormData();
                formData.append('file', file);
                const res = await fetch('/verify/file', { method: 'POST', body: formData });
                const data = await res.json();

                // Usually async file returns job IDs
                if (data.job_ids) {
                    alert(`Queued ${data.count} jobs. Switch to Async tab/Live Operations to monitor.`);
                    // Ideally we fetch statuses for these IDs but for now we rely on user action
                    loadHistory();
                }
            } catch (err) {
                alert('Upload failed: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
                document.getElementById('bulkFile').value = '';
                document.getElementById('fileName').textContent = 'Click to upload file';
            }
        }

        async function verifyAsync() {
            const email = document.getElementById('asyncEmail').value;
            const password = document.getElementById('asyncPassword').value;
            if (!email || !password) return;

            const btn = document.getElementById('asyncBtn');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = 'Submitting...';

            try {
                const res = await fetch('/verify/async', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.job_id) {
                    addJobToMonitor(data.job_id, email);
                }

                document.getElementById('asyncEmail').value = '';
                document.getElementById('asyncPassword').value = '';
                loadHistory();
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        function addJobToMonitor(id, email) {
            const container = document.getElementById('jobsContainer');
            const list = document.getElementById('jobsList');
            container.classList.remove('hidden');

            jobs[id] = { id, email, status: 'pending' };
            state.activeJobs++;
            updateStats();

            list.insertAdjacentHTML('afterbegin', getJobCard(jobs[id]));
            pollJob(id);
        }

        function pollJob(id) {
            const interval = setInterval(async () => {
                try {
                    const res = await fetch('/verify/status?id=' + id);
                    if (res.status === 200) {
                        const data = await res.json();
                        // Update UI
                        const jobEl = document.getElementById(`job-${id}`);
                        if (jobEl) jobEl.outerHTML = getJobCard({ ...data, id, email: jobs[id].email });

                        if (data.status !== 'pending') {
                            clearInterval(interval);
                            state.activeJobs--;

                            // Move from active list to results
                            displayResults([{ ...data, id, email: jobs[id].email }]);

                            // Remove from active list after delay
                            setTimeout(() => {
                                const finalEl = document.getElementById(`job-${id}`);
                                if (finalEl) finalEl.remove();
                                if (document.getElementById('jobsList').children.length === 0) {
                                    document.getElementById('jobsContainer').classList.add('hidden');
                                }
                            }, 2000);
                        }
                    }
                } catch (e) { console.error(e); }
            }, 1000);
        }

        async function loadHistory() {
            const list = document.getElementById('historyList');
            const filter = document.getElementById('historyFilter').value;
            // Only show loading if empty mostly
            if (list.innerText.includes('Waiting')) {
                list.innerHTML = '<div class="text-center py-4"><svg class="w-6 h-6 animate-spin mx-auto text-indigo-500" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg></div>';
            }

            try {
                // Build Query
                let url = `/api/scans?page=${state.page}&limit=${state.limit}`;
                if (filter) url += `&email=${encodeURIComponent(filter)}`;
                if (state.filterStatus) url += `&status=${state.filterStatus}`;

                const res = await fetch(url);
                const json = await res.json();

                // Handle new response format vs old fallback
                const data = json.data || json;
                if (json.pagination) {
                    state.total = json.pagination.total;
                    state.page = json.pagination.page;
                    updatePaginationUI();
                }

                if (data.length === 0) {
                    list.innerHTML = '<div class="text-center py-4 text-slate-500 text-sm">No history found.</div>';
                    return;
                }

                window.lastHistoryData = data; // Cache for export (current view)

                let html = '';
                data.forEach(scan => {
                    const isSuccess = scan.status === 'success';
                    const isPending = scan.status === 'pending';

                    let statusColor = 'bg-rose-500';
                    if (isSuccess) statusColor = 'bg-emerald-500';
                    if (isPending) statusColor = 'bg-amber-500';

                    html += `<div onclick="viewScan('${scan.id}')" class="p-3 bg-white/5 rounded-lg border border-transparent hover:border-indigo-500/50 hover:bg-white/10 transition-all group relative cursor-pointer active:scale-[0.99]" title="Click to view details">
                        <div class="flex items-center gap-3">
                            <div class="w-2 h-2 rounded-full ${statusColor}"></div>
                            <div class="flex-1 min-w-0">
                                <p class="text-xs text-slate-300 truncate font-medium">${scan.email}</p>
                                <p class="text-[10px] text-slate-500">${new Date(scan.created_at).toLocaleString()}</p>
                            </div>
                            <span class="text-[10px] uppercase font-bold text-slate-600">${scan.status}</span>
                        </div>
                        
                        ${isPending ? `
                        <div class="mt-2 pt-2 border-t border-white/5 flex justify-end">
                             <button onclick="event.stopPropagation(); retryScanWithLogs('${scan.id}', '${scan.email}', '${scan.password || ''}')" class="text-[10px] bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 px-2 py-1 rounded transition-colors flex items-center gap-1 border border-amber-500/20">
                                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                Try Now
                             </button>
                        </div>` : ''}

                        ${!isSuccess && !isPending ? `
                        <div class="mt-2 pt-2 border-t border-white/5 flex justify-end">
                             <button onclick="event.stopPropagation(); retryScanWithLogs('${scan.id}', '${scan.email}', '${scan.password || ''}')" class="text-[10px] bg-white/5 hover:bg-white/10 text-indigo-300 px-2 py-1 rounded transition-colors flex items-center gap-1">
                                <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                                Retry
                             </button>
                        </div>` : ''}
                    </div>`;
                });
                list.innerHTML = html;
            } catch (e) {
                console.error(e);
                list.innerHTML = '<div class="text-center py-4 text-rose-400 text-sm">Failed.</div>';
            }
        }


        // Modal & Retry Logic
        let pollInterval = null;

        async function retryScanWithLogs(oldId, email, password) {
            // Start Async Verification
            try {
                // Determine password: if not provided, try to find in history or ask user?
                // The backend now stores password. We pass it back in 'res'.
                // If password is blank (e.g. from old scan), we might fail or need fallback.
                if (!password) {
                    // Try to get from single input if matches
                    if (document.getElementById('singleEmail').value === email) {
                        password = document.getElementById('singlePassword').value;
                    }
                    if (!password) {
                        alert('Password not found for this scan. Please retry manually.');
                        switchTab('single');
                        document.getElementById('singleEmail').value = email;
                        return;
                    }
                }

                // Call Async
                const res = await fetch('/verify/async', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.job_id) {
                    openLogModal(data.job_id, email);
                } else {
                    alert('Failed to start retry job');
                }
            } catch (e) {
                alert('Error retrying: ' + e.message);
            }
        }

        function openLogModal(jobId, email) {
            const modal = document.getElementById('logModal');
            const content = document.getElementById('logModalContent');
            const title = document.getElementById('logModalTitle');
            const logsContainer = document.getElementById('modalLogs');

            modal.classList.remove('hidden');
            // Small delay for transition
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);

            title.textContent = `Verifying ${email}...`;
            logsContainer.innerHTML = '<div class="text-slate-500 italic text-center mt-20">Connecting to live feed...</div>';

            pollLogModal(jobId);
        }

        function closeLogModal() {
            const modal = document.getElementById('logModal');
            const content = document.getElementById('logModalContent');

            if (pollInterval) clearInterval(pollInterval);

            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            modal.classList.add('opacity-0');

            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);

            loadHistory(); // Refresh history on close to show result
        }

        function pollLogModal(jobId) {
            const logsContainer = document.getElementById('modalLogs');
            const statusEl = document.getElementById('logStatus');
            const timeEl = document.getElementById('logTime');
            let startTime = Date.now();

            if (pollInterval) clearInterval(pollInterval);

            pollInterval = setInterval(async () => {
                try {
                    // Update timer
                    const elapsed = Math.floor((Date.now() - startTime) / 1000);
                    const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
                    const secs = (elapsed % 60).toString().padStart(2, '0');
                    timeEl.textContent = `${mins}:${secs}`;

                    const res = await fetch('/verify/status?id=' + jobId);
                    const data = await res.json();

                    // Update Status
                    statusEl.textContent = data.status.toUpperCase();
                    if (data.status === 'success') {
                        statusEl.className = 'uppercase tracking-wider font-semibold text-emerald-400';
                        document.getElementById('logModalTitle').innerHTML = 'Verification Complete! <span class="text-emerald-400">✓</span>';
                    } else if (data.status === 'failed') {
                        statusEl.className = 'uppercase tracking-wider font-semibold text-rose-400';
                        document.getElementById('logModalTitle').innerHTML = 'Verification Failed <span class="text-rose-400">✕</span>';
                    } else if (data.status === 'pending') {
                        statusEl.className = 'uppercase tracking-wider font-semibold text-amber-400';
                    } else {
                        statusEl.className = 'uppercase tracking-wider font-semibold text-indigo-400';
                    }

                    // Render Logs
                    if (data.logs && data.logs.length > 0) {
                        logsContainer.innerHTML = data.logs.map(line => {
                            // Colorize log lines
                            let colorClass = 'text-slate-300';
                            if (line.includes('[Auth]')) colorClass = 'text-purple-300';
                            if (line.includes('[Discovery]')) colorClass = 'text-blue-300';
                            if (line.includes('failed') || line.includes('Error')) colorClass = 'text-rose-300';
                            if (line.includes('successful')) colorClass = 'text-emerald-300 font-bold';
                            return `<div class="${colorClass}">${line}</div>`;
                        }).join('');
                        // Scroll to bottom
                        logsContainer.scrollTop = logsContainer.scrollHeight;
                    }

                    // Stop if done
                    if (data.status !== 'pending' && data.status !== 'processing') {
                        clearInterval(pollInterval);
                    }

                } catch (e) {
                    console.error('Poll error', e);
                }
            }, 1000);
        }

        function updatePaginationUI() {
            const totalPages = Math.ceil(state.total / state.limit);
            document.getElementById('pageInfo').textContent = `Page ${state.page} of ${totalPages || 1} (${state.total} items)`;
            document.getElementById('prevBtn').disabled = state.page <= 1;
            document.getElementById('nextBtn').disabled = state.page >= totalPages;
        }

        function changePage(delta) {
            state.page += delta;
            loadHistory();
        }

        function setFilter(status) {
            state.filterStatus = status;
            state.page = 1; // Reset to page 1

            // UI Toggle
            ['all', 'success', 'failed', 'pending'].forEach(s => {
                const btn = document.getElementById('tab-' + s);
                if ((s === 'all' && !status) || s === status) {
                    btn.classList.remove('text-slate-400', 'hover:text-white');
                    btn.classList.add('text-white', 'bg-indigo-500', 'shadow-lg');
                } else {
                    btn.classList.add('text-slate-400', 'hover:text-white');
                    btn.classList.remove('text-white', 'bg-indigo-500', 'shadow-lg');
                }
            });
            loadHistory();
        }

        function viewScan(id) {
            const scan = window.lastHistoryData.find(s => s.id === id);
            if (scan) {
                // Ensure ID is present for display logic
                displayResults([scan]);
            }
        }

        function retryScan(email) {
            // Switch to Single tab
            switchTab('single');
            document.getElementById('singleEmail').value = email;
            document.getElementById('singlePassword').focus();

            // Toast notification
            // (Simplified for now)
            alert(`Ready to retry ${email}. Please enter password.`);
        }

        function toggleAutoRefresh() {
            const btn = document.getElementById('refreshBtn');
            state.autoRefresh = !state.autoRefresh;

            if (state.autoRefresh) {
                btn.classList.add('text-indigo-400', 'bg-indigo-500/10');
                btn.classList.remove('text-slate-400', 'bg-white/5');
                loadHistory(); // load immediately
                state.refreshInterval = setInterval(loadHistory, 5000);
            } else {
                btn.classList.remove('text-indigo-400', 'bg-indigo-500/10');
                btn.classList.add('text-slate-400', 'bg-white/5');
                if (state.refreshInterval) clearInterval(state.refreshInterval);
            }
        }

        async function exportHistory(mode = 'current', format = 'csv') {
            let data = window.lastHistoryData;
            const triggerBtn = document.querySelector('button[title="Export Options"]');

            if (mode === 'all') {
                if (triggerBtn) triggerBtn.classList.add('animate-pulse', 'text-amber-400');

                try {
                    const res = await fetch(`/api/scans?limit=1000000&status=${state.filterStatus || ''}`);
                    const json = await res.json();
                    data = json.data || json;
                } catch (e) {
                    console.error('Export fetch error', e);
                    alert('Export failed: ' + e.message);
                    if (triggerBtn) triggerBtn.classList.remove('animate-pulse', 'text-amber-400');
                    return;
                } finally {
                    if (triggerBtn) triggerBtn.classList.remove('animate-pulse', 'text-amber-400');
                }
            }

            if (!data || data.length === 0) {
                alert('No history to export.');
                return;
            }

            let blob, filename;

            if (format === 'txt') {
                const content = data.map(row => `${row.email}:${row.password || ''}`).join('\n');
                blob = new Blob([content], { type: 'text/plain' });
                filename = 'verified_emails.txt';
            } else {
                const headers = ['ID', 'Email', 'Password', 'Domain', 'Status', 'Error', 'Time'];
                const csvRows = [headers.join(',')];

                data.forEach(row => {
                    const dateStr = row.created_at ? new Date(row.created_at).toISOString() : 'N/A';
                    const values = [
                        row.id,
                        row.email,
                        row.password || '',
                        row.domain,
                        row.status,
                        `"${(row.error || '').replace(/"/g, '""')}"`,
                        dateStr
                    ];
                    csvRows.push(values.join(','));
                });
                blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
                filename = 'verified_emails.csv';
            }

            // Robust download trigger
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);
        }

        // Send Test Logic
        let currentTestData = { email: '', password: '' };

        function openTestModal(email, password) {
            currentTestData = { email, password };
            document.getElementById('testFrom').textContent = email;

            const modal = document.getElementById('testModal');
            const content = document.getElementById('testModalContent');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeTestModal() {
            const modal = document.getElementById('testModal');
            const content = document.getElementById('testModalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        async function performTestSend() {
            const to = document.getElementById('testTo').value;
            const subject = document.getElementById('testSubject').value;
            const body = document.getElementById('testBody').value;
            const btn = document.getElementById('sendTestBtn');

            if (!to) { alert('Recipient email is required'); return; }

            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                const res = await fetch('/api/send-test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: currentTestData.email,
                        password: currentTestData.password,
                        to,
                        subject,
                        body
                    })
                });

                if (res.ok) {
                    alert('Test email sent successfully!');
                    closeTestModal();
                } else {
                    const err = await res.text();
                    alert('Failed to send: ' + err);
                }
            } catch (e) {
                alert('Network error: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        /* ============================================================
           WORKER MONITOR
        ============================================================ */
        async function updateWorkerMonitor() {
            try {
                const res = await fetch('/api/workers');
                const workers = await res.json();
                const grid = document.getElementById('workerGrid');

                grid.innerHTML = workers.map(w => {
                    const isIdle = w.status === 'idle';
                    // Shorten current job for display
                    const jobDisplay = w.current_job && w.current_job.length > 20 ? w.current_job.substring(0, 18) + '...' : w.current_job;

                    return `
                    <div class="bg-white/5 rounded p-2 border border-white/5 transition-colors ${!isIdle ? 'border-indigo-500/30 bg-indigo-500/5' : ''}">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] font-bold text-slate-500">W${w.id}</span>
                            <span class="text-[10px] uppercase font-bold ${isIdle ? 'text-slate-600' : 'text-indigo-400 animate-pulse'}">${w.status}</span>
                        </div>
                        ${!isIdle ? `
                        <div class="truncate text-[10px] text-slate-300 font-mono mb-1.5" title="${w.current_job}">${jobDisplay}</div>
                        <button onclick="stopWorker(${w.id})" class="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-[10px] py-1 rounded transition-colors border border-rose-500/20 active:scale-95">Stop</button>
                        ` : '<div class="h-6 flex items-center justify-center"><span class="text-[10px] text-slate-700">Waiting...</span></div>'}
                    </div>`;
                }).join('');
            } catch (e) { }
        }

        async function stopWorker(id) {
            if (!confirm('Stop worker ' + id + '?')) return;
            await fetch('/api/workers/stop', { method: 'POST', body: JSON.stringify({ id: parseInt(id), all: false }) });
            updateWorkerMonitor(); // Force update
        }

        async function stopAllWorkers() {
            if (!confirm('Stop ALL active verification jobs?')) return;
            await fetch('/api/workers/stop', { method: 'POST', body: JSON.stringify({ all: true }) });
            updateWorkerMonitor();
        }

        // Start Polling
        setInterval(updateWorkerMonitor, 1500);
        updateWorkerMonitor(); // Initial call

        async function clearHistory() {
            if (confirm("Delete all history logs? This cannot be undone.")) {
                await fetch('/api/scans', { method: 'DELETE' });
                loadHistory();
            }
        }

        // Init
        loadHistory();
    </script>
