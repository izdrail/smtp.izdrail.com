<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="mb-8">
            <div class="flex items-center gap-3 mb-2">
                <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <h1 class="text-3xl font-bold text-white">Email Verifier</h1>
            </div>
            <p class="text-slate-400">Verify email credentials and SMTP capabilities</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Left Panel -->
            <div class="lg:col-span-1">
                <div class="bg-slate-800 rounded-lg border border-slate-700 overflow-hidden sticky top-6">
                    <!-- Tabs -->
                    <div class="flex border-b border-slate-700 text-sm">
                        <button onclick="switchTab('single')"
                            class="tab-btn flex-1 px-3 py-3 font-medium transition bg-blue-600 text-white"
                            data-tab="single">Single</button>
                        <button onclick="switchTab('bulk')"
                            class="tab-btn flex-1 px-3 py-3 font-medium transition text-slate-400 hover:text-slate-300"
                            data-tab="bulk">Bulk</button>
                        <button onclick="switchTab('async')"
                            class="tab-btn flex-1 px-3 py-3 font-medium transition text-slate-400 hover:text-slate-300"
                            data-tab="async">Async</button>
                        <button onclick="switchTab('history')"
                            class="tab-btn flex-1 px-3 py-3 font-medium transition text-slate-400 hover:text-slate-300"
                            data-tab="history">History</button>
                    </div>

                    <!-- Content -->
                    <div class="p-6">
                        <!-- Single Tab -->
                        <div id="single" class="tab-content space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
                                <input type="email" id="singleEmail" placeholder="user@example.com"
                                    class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                                <input type="password" id="singlePassword" placeholder="••••••••"
                                    class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                            </div>
                            <button onclick="verifySingle()" id="singleBtn"
                                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded transition flex items-center justify-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                                </svg>
                                <span>Verify</span>
                            </button>
                        </div>

                        <!-- Bulk Tab -->
                        <div id="bulk" class="tab-content space-y-4 hidden">
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Upload File</label>
                                <input type="file" id="bulkFile" accept=".txt,.csv"
                                    class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded text-slate-300 text-sm">
                                <p class="text-xs text-slate-500 mt-2">Format: email:password (one per line)</p>
                            </div>
                            <button onclick="verifyBulk()" id="bulkBtn"
                                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded transition flex items-center justify-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                                </svg>
                                <span>Verify Bulk</span>
                            </button>
                        </div>

                        <!-- Async Tab -->
                        <div id="async" class="tab-content space-y-4 hidden">
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Email Address</label>
                                <input type="email" id="asyncEmail" placeholder="user@example.com"
                                    class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                                <input type="password" id="asyncPassword" placeholder="••••••••"
                                    class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded text-white placeholder-slate-500 focus:outline-none focus:border-blue-500">
                            </div>
                            <button onclick="verifyAsync()" id="asyncBtn"
                                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded transition flex items-center justify-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                                </svg>
                                <span>Submit Job</span>
                            </button>
                        </div>

                        <!-- History Tab -->
                        <div id="history" class="tab-content space-y-4 hidden">
                            <div class="flex gap-2">
                                <input type="text" id="historyFilter" placeholder="Filter by email..."
                                    class="flex-1 px-4 py-2 bg-slate-700 border border-slate-600 rounded text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 text-sm">
                                <button onclick="loadHistory()"
                                    class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded text-sm font-medium">Load</button>
                                <button onclick="clearHistory()"
                                    class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded text-sm font-medium">Clear</button>
                            </div>
                            <div id="historyList" class="space-y-2 max-h-72 overflow-y-auto text-sm">
                                <p class="text-slate-400 text-center py-4">Click Load to fetch history</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Single/Bulk Results -->
                <div id="resultsContainer"
                    class="bg-slate-800 rounded-lg border border-slate-700 p-12 flex items-center justify-center min-h-96">
                    <p class="text-slate-400">Results will appear here</p>
                </div>

                <!-- Async Jobs -->
                <div id="jobsContainer" class="bg-slate-800 rounded-lg border border-slate-700 p-6 hidden">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold text-white">Background Jobs</h2>
                        <span id="jobCount" class="text-xs bg-blue-600 text-white px-3 py-1 rounded-full">0</span>
                    </div>
                    <div id="jobsList" class="space-y-3 max-h-96 overflow-y-auto"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const jobs = {};

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('bg-blue-600', 'text-white');
                el.classList.add('text-slate-400', 'hover:text-slate-300');
            });

            document.getElementById(tab).classList.remove('hidden');
            document.querySelector('[data-tab="' + tab + '"]').classList.remove('text-slate-400', 'hover:text-slate-300');
            document.querySelector('[data-tab="' + tab + '"]').classList.add('bg-blue-600', 'text-white');
        }

        function getStatusColor(status) {
            switch (status) {
                case 'success': return 'text-green-600 bg-green-50 border-green-200';
                case 'failed': return 'text-red-600 bg-red-50 border-red-200';
                case 'pending': return 'text-yellow-600 bg-yellow-50 border-yellow-200';
                default: return 'text-gray-600 bg-gray-50 border-gray-200';
            }
        }

        function getStatusIcon(status) {
            switch (status) {
                case 'success': return '✓';
                case 'failed': return '✕';
                case 'pending': return '⟳';
                default: return '?';
            }
        }

        function getStatusBgColor(status) {
            switch (status) {
                case 'success': return 'bg-green-100';
                case 'failed': return 'bg-red-100';
                case 'pending': return 'bg-yellow-100';
                default: return 'bg-gray-100';
            }
        }

        function displayResults(results) {
            const container = document.getElementById('resultsContainer');
            if (!results || results.length === 0) return;

            let html = '<div class="w-full"><h2 class="text-lg font-semibold text-white mb-4">Verification Results</h2><div class="space-y-3">';

            results.forEach(result => {
                const colorClass = getStatusColor(result.status);
                const bgColor = getStatusBgColor(result.status);
                const createdTime = result.created_at ? new Date(result.created_at).toLocaleTimeString() : '-';
                const completedTime = result.completed_at ? new Date(result.completed_at).toLocaleTimeString() : '-';

                let authMethods = 'None';
                if (result.capabilities && result.capabilities.auth_methods) {
                    authMethods = result.capabilities.auth_methods.join(', ');
                }

                let capabilitiesHtml = '';
                if (result.capabilities) {
                    capabilitiesHtml = '<div class="text-sm mt-2 space-y-1 opacity-90">' +
                        '<p><span class="font-medium">Host:</span> ' + result.capabilities.host + '</p>' +
                        '<p><span class="font-medium">Auth:</span> ' + authMethods + '</p>' +
                        '<p><span class="font-medium">StartTLS:</span> ' + (result.capabilities.starttls ? 'Yes' : 'No') + '</p>' +
                        '</div>';
                }

                let errorHtml = '';
                if (result.error) {
                    errorHtml = '<p class="text-sm mt-1 opacity-75">Error: ' + result.error + '</p>';
                }

                html += '<div class="p-4 rounded-lg border ' + colorClass + '">' +
                    '<div class="flex items-start gap-3">' +
                    '<div class="w-8 h-8 rounded-full ' + bgColor + ' flex items-center justify-center font-bold text-sm">' + getStatusIcon(result.status) + '</div>' +
                    '<div class="flex-1 min-w-0">' +
                    '<p class="font-medium capitalize">' + result.status + '</p>' +
                    errorHtml +
                    capabilitiesHtml +
                    '<div class="text-xs mt-2 opacity-60 space-y-1">' +
                    '<p>Created: ' + createdTime + '</p>' +
                    (completedTime !== '-' ? '<p>Completed: ' + completedTime + '</p>' : '') +
                    '</div>' +
                    '</div>' +
                    '</div>' +
                    '</div>';
            });
            html += '</div></div>';
            container.innerHTML = html;
        }

        function updateJob(jobId, job) {
            const container = document.getElementById('jobsContainer');
            const list = document.getElementById('jobsList');
            const countBadge = document.getElementById('jobCount');

            container.classList.remove('hidden');
            countBadge.textContent = Object.keys(jobs).length;

            const colorClass = getStatusColor(job.status);
            const bgColor = getStatusBgColor(job.status);
            const createdTime = job.created_at ? new Date(job.created_at).toLocaleTimeString() : '-';
            const completedTime = job.completed_at ? new Date(job.completed_at).toLocaleTimeString() : '-';

            let authMethods = 'None';
            if (job.capabilities && job.capabilities.auth_methods) {
                authMethods = job.capabilities.auth_methods.join(', ');
            }

            let capabilitiesHtml = '';
            if (job.capabilities) {
                capabilitiesHtml = '<div class="text-sm mt-2 space-y-1 opacity-90">' +
                    '<p><span class="font-medium">Host:</span> ' + job.capabilities.host + '</p>' +
                    '<p><span class="font-medium">Auth:</span> ' + authMethods + '</p>' +
                    '</div>';
            }

            let errorHtml = '';
            if (job.error) {
                errorHtml = '<p class="text-sm mt-1 opacity-75">Error: ' + job.error + '</p>';
            }

            const spinClass = job.status === 'pending' ? 'spin' : '';

            let jobHtml = '<div class="p-4 rounded-lg border ' + colorClass + '" id="job-' + jobId + '">' +
                '<div class="flex items-start gap-3">' +
                '<div class="w-8 h-8 rounded-full ' + bgColor + ' flex items-center justify-center font-bold text-sm ' + spinClass + '">' + getStatusIcon(job.status) + '</div>' +
                '<div class="flex-1 min-w-0">' +
                '<p class="font-medium break-all">' + job.email + '</p>' +
                '<p class="text-xs opacity-75 mt-1">ID: <code class="text-xs">' + jobId.substring(0, 12) + '...</code></p>' +
                '<p class="text-sm mt-2 capitalize font-medium">' + job.status + '</p>' +
                errorHtml +
                capabilitiesHtml +
                '<div class="text-xs mt-2 opacity-60 space-y-1">' +
                '<p>Created: ' + createdTime + '</p>' +
                (completedTime !== '-' ? '<p>Completed: ' + completedTime + '</p>' : '<p>Processing...</p>') +
                '</div>' +
                '</div>' +
                '</div>' +
                '</div>';

            const existing = document.getElementById('job-' + jobId);
            if (existing) {
                existing.outerHTML = jobHtml;
            } else {
                list.innerHTML += jobHtml;
            }
        }

        async function verifySingle() {
            const email = document.getElementById('singleEmail').value;
            const password = document.getElementById('singlePassword').value;
            if (!email || !password) return;

            const btn = document.getElementById('singleBtn');
            btn.disabled = true;
            btn.querySelector('span').textContent = 'Verifying...';

            try {
                const res = await fetch('/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });
                const data = await res.json();
                displayResults([data]);
                document.getElementById('singleEmail').value = '';
                document.getElementById('singlePassword').value = '';
            } catch (err) {
                displayResults([{ status: 'failed', error: 'Connection error: ' + err.message }]);
            } finally {
                btn.disabled = false;
                btn.querySelector('span').textContent = 'Verify';
            }
        }

        async function verifyBulk() {
            const file = document.getElementById('bulkFile').files[0];
            if (!file) return;

            const btn = document.getElementById('bulkBtn');
            btn.disabled = true;
            btn.querySelector('span').textContent = 'Processing...';

            try {
                const formData = new FormData();
                formData.append('file', file);
                const res = await fetch('/verify/file', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                displayResults(data || []);
                document.getElementById('bulkFile').value = '';
            } catch (err) {
                displayResults([{ status: 'failed', error: 'Connection error: ' + err.message }]);
            } finally {
                btn.disabled = false;
                btn.querySelector('span').textContent = 'Verify Bulk';
            }
        }

        async function verifyAsync() {
            const email = document.getElementById('asyncEmail').value;
            const password = document.getElementById('asyncPassword').value;
            if (!email || !password) return;

            const btn = document.getElementById('asyncBtn');
            btn.disabled = true;
            btn.querySelector('span').textContent = 'Submitting...';

            try {
                const res = await fetch('/verify/async', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });
                const responseData = await res.json();
                const jobId = responseData.job_id;

                jobs[jobId] = { email: email, status: 'pending', created_at: new Date() };
                updateJob(jobId, jobs[jobId]);
                pollJob(jobId);

                document.getElementById('asyncEmail').value = '';
                document.getElementById('asyncPassword').value = '';
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.querySelector('span').textContent = 'Submit Job';
            }
        }

        function pollJob(jobId, maxAttempts) {
            if (!maxAttempts) maxAttempts = 120;
            let attempts = 0;

            const interval = setInterval(async function () {
                attempts++;

                try {
                    const res = await fetch('/verify/status?id=' + jobId);

                    if (res.status === 200) {
                        const data = await res.json();
                        jobs[jobId] = Object.assign(jobs[jobId], data);
                        updateJob(jobId, jobs[jobId]);
                        clearInterval(interval);
                    } else if (res.status === 202) {
                        jobs[jobId].status = 'pending';
                        updateJob(jobId, jobs[jobId]);
                    }
                } catch (err) {
                    console.error('Poll error:', err);
                }

                if (attempts >= maxAttempts) {
                    clearInterval(interval);
                }
            }, 500);
        }

        async function loadHistory() {
            const filter = document.getElementById('historyFilter').value;
            const historyList = document.getElementById('historyList');

            historyList.innerHTML = '<p class="text-slate-400 text-center py-4">Loading...</p>';

            try {
                let url = '/api/scans';
                if (filter) {
                    url += '?email=' + encodeURIComponent(filter);
                }
                const res = await fetch(url);
                const data = await res.json();

                let scans = data;
                if (!Array.isArray(scans)) {
                    scans = [];
                }

                if (scans.length === 0) {
                    historyList.innerHTML = '<p class="text-slate-400 text-center py-4">No scans found</p>';
                    return;
                }

                let html = '';
                scans.forEach(scan => {
                    const colorClass = getStatusColor(scan.status);
                    const bgColor = getStatusBgColor(scan.status);
                    const timestamp = new Date(scan.created_at).toLocaleString();

                    html += '<div class="p-3 rounded border ' + colorClass + '">' +
                        '<div class="flex items-start gap-2">' +
                        '<div class="w-6 h-6 rounded-full ' + bgColor + ' flex items-center justify-center font-bold text-xs">' + getStatusIcon(scan.status) + '</div>' +
                        '<div class="flex-1 min-w-0">' +
                        '<p class="font-medium text-xs break-all">' + scan.email + '</p>' +
                        '<p class="text-xs opacity-75 mt-1">' + timestamp + '</p>' +
                        (scan.error ? '<p class="text-xs opacity-75 text-red-400 mt-1">' + scan.error + '</p>' : '') +
                        '</div>' +
                        '</div>' +
                        '</div>';
                });
                historyList.innerHTML = html;
            } catch (err) {
                historyList.innerHTML = '<p class="text-red-400 text-center py-4">Error loading history: ' + err.message + '</p>';
            }
        }

        async function clearHistory() {
            if (!confirm('Are you sure you want to clear all scans?')) return;

            try {
                const res = await fetch('/api/scans', { method: 'DELETE' });
                if (res.ok) {
                    document.getElementById('historyList').innerHTML = '<p class="text-slate-400 text-center py-4">History cleared</p>';
                } else {
                    alert('Failed to clear history');
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }
    </script>
</body>

</html>
